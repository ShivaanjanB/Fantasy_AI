<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FantasyCoach AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --gold: #c8a84b;
        --gold2: #f0d080;
        --gold-dim: rgba(200,168,75,0.18);
        --green: #5adb8a;
        --red: #e25a5a;
        --amber: #e2a03b;
        --blue: #3b8ae2;
        --bg: #0b0d12;
        --bg2: #0f1118;
        --bg3: #141720;
        --text: #e8e8ec;
        --text2: #8a8ea0;
        --text3: #5a5e70;
        --border: rgba(255,255,255,0.06);
        --border2: rgba(255,255,255,0.1);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Barlow', sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        height: 100vh;
      }
      #root { height: 100vh; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
      ::selection { background: rgba(200,168,75,0.3); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
